<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .active{
        background-color: aqua;

        animation: left 1s linear;
    }
    .active:hover{
        background-color: red;
    }

    @keyframes left{
        0% {
            transform: translateX(-100px);
        }

        100%{
            transform: translateX(0px);
        }
    }

    body{
        height: 100vh;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        gap: 20px;
    }

    .display >input {
        border: none;
        border-bottom: 2px solid black;
        padding-bottom: 10px;

        outline: none;
    }

    .display > button {
        width: 50px;
        border: none;
        border-radius: 25px;
        background-color: blueviolet;

        color: white;

        cursor: pointer;
    }

    ol{
        width: auto;
        height: auto;

        
    }

    ol > li:hover:after{
        content: "delete";
        position: relative;
        width: 100%;
        height: 100%;

        display: flex;
        justify-content: end;
        align-items: center;

        cursor: pointer;
    }


</style>
<body>

<div class="display">
        
<input type="text" placeholder="Enter your task">

<button>add</button>
</div>

<ol></ol>


<button><a href="./calc.html">Calculator</a></button>
<button><a href="./Api.html">APi</a></button>

    


     <script src="./script.js"></script>
</body>
</html>
