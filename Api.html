<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API</title>
</head>
<style>
    .api{
        height: auto;
        border: 10px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
    }

    .api > div{
        width: 200px;
        height: 250px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;

        border: 2px solid black;

        background-color: bisque;
    }

    .api > div > img {
        width: 100px;
        height: 100px;
    }

    .api > div > img:hover{
       box-shadow: 2px 2px 2px 2px black;
    }

    .api > div > p {
        font-size: 15px;
        font-weight: 700;

        color: blueviolet;

    }

    .api > div > button {
        width: 120px;

        background-color: aquamarine;
        color: rgb(8, 115, 209);
        border: none;
        border-radius: 120px;

    }

     .api > div > button:hover{
        border: 2px solid black;
        cursor: pointer;
     }


</style>
<body>

    <h1>APi method</h1>

    <div class="api"></div>


    <script src="./Api.js"></script>
</body>
</html>
